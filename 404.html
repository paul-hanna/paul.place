    '/contact': '/about'
  };
  var l = window.location;
  var dest = redirects[l.pathname] || redirects[decodeURIComponent(l.pathname)];
  if (dest) {
    l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + dest);
  } else {
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }
</script>
