<div style="max-width:680px;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;color:#1a1a1a">
<h1>Disposal</h1>
<p><em>Paul Hanna &amp; Maya Castronovo · 2024</em></p>
<img src="images/works/disposal.png" alt="Disposal" style="max-width:100%;height:auto">
<p>Filmed at Shirley Chisholm State Park, site of the defunct Fountain Avenue Landfill in Brooklyn. From 1961 to 1985, the landfill received hundreds of thousands of tons of trash and illegal hazardous waste. The film's cyclical, embodied camera encourages us to consider how violence is encoded within the landscape itself. By refusing conventional cinematic closure, Disposal situates these traces of violence within frameworks of ecological restoration and renewal.</p>
